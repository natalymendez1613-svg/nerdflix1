<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERDFLIX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #000;
            overflow-x: hidden;
            color: white;
        }

        /* HERO */
        .hero {
            position: relative;
            min-height: 100vh;

            background:
                linear-gradient(to top,
                    rgba(0, 0, 0, .50) 0%,
                    rgba(0, 0, 0, .45) 40%,
                    rgba(0, 0, 0, .50) 80%),
                url("images/fotodefondo.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .35);
        }

        .navbar-custom,
        .hero-content {
            position: relative;
            z-index: 2;
        }

        /* NAVBAR */
        .navbar-custom {
            padding: 25px 60px;
        }

        .logo {
            width: 220px;
        }

        .right-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .language-btn {
            background: rgba(0, 0, 0, .65);
            color: white;
            border: 1px solid rgba(255, 255, 255, .35);
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 500;
        }

        .login-btn {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 18px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #c40812;
        }

        /* HERO CONTENT */
        .hero-content {
            min-height: calc(100vh - 90px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-text {
            max-width: 850px;
        }

        .hero-text h1 {
            font-size: 4.2rem;
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 25px;
        }

        .hero-text h3 {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* EMAIL */
        .email-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .email-form input {
            width: 500px;
            max-width: 100%;
            height: 60px;
            background: rgba(22, 22, 22, .85);
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 4px;
            color: white;
            padding-left: 15px;
            font-size: 1rem;
        }

        .start-btn {
            height: 60px;
            padding: 0 35px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .start-btn:hover {
            background: #c40812;
        }

        /* CARDS */

        .slider-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:120px;
    border:none;
    border-radius:8px;
    background:rgba(35,35,35,.8);
    color:white;
    font-size:30px;
    cursor:pointer;
    z-index:100;
    transition:.3s;
}

.slider-btn:hover{
    background:rgba(80,80,80,.95);
}

.prev-btn{
    left:10px;
}

.next-btn{
    right:10px;
}

.slider-container{
    position: relative;
    width: 100%;
    padding: 0 70px;
}

.slider-container:hover .slider-btn{
    opacity:1;
}

.slider-btn:hover{
    background:rgba(50,50,50,.95);
}

.prev-btn{
    left:0;
}

.next-btn{
    right:0;
}

        .cards {
            background: #000;
            padding: 60px 40px;
        }

        .cards h2 {
            margin-bottom: 25px;
            font-weight: 700;
        }

        .movie-row{
    display:flex;
    gap:18px;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    scrollbar-width:none;
    padding:10px 0;
}

        .movie-row::-webkit-scrollbar {
            display: none;
        }

        .movie-card{
    min-width:200px;
    height:300px;
    position:relative;
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
    cursor:pointer;
    transition:.3s;
}

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank {
            position: absolute;
            bottom: -15px;
            left: -5px;
            font-size: 7rem;
            font-weight: 900;
            color: rgb(0, 0, 0);
            -webkit-text-stroke: 2px rgb(255, 255, 255);
            line-height: 1;
        }

        /* FOOTER VACÍO */
        .footer {
            height: 80px;
            background: #000;
        }

        @media(max-width:768px) {

            .navbar-custom {
                padding: 20px;
            }

            .logo {
                width: 140px;
            }

            .hero-text h1 {
                font-size: 2.4rem;
            }

            .hero-text h3 {
                font-size: 1.1rem;
            }

            .email-form {
                flex-direction: column;
            }

            .email-form input,
            .start-btn {
                width: 100%;
            }

            .movie-card {
                min-width: 160px;
                height: 240px;
            }

            .rank {
                font-size: 5rem;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <nav class="navbar-custom d-flex justify-content-between align-items-center">

            <!-- LOGO NERDFLIX -->
            <img src="images/nerdflix.png" alt="NERDFLIX" class="logo">

            <div class="right-menu">

                <div class="dropdown">
                    <button class="language-btn dropdown-toggle" data-bs-toggle="dropdown">
                        Español
                    </button>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Español</a></li>
                        <li><a class="dropdown-item" href="#">English</a></li>
                    </ul>
                </div>

                <button class="login-btn">
                    Iniciar sesión
                </button>

            </div>

        </nav>

        <div class="hero-content">

            <div class="hero-text">

                <h1>
                    Películas y series ilimitadas y mucho más
                </h1>

                <h3>
                    A partir de $18.900. Cancela cuando quieras.
                </h3>

                <p>
                    ¿Quieres ver NERDFLIX ya? Ingresa tu email para crear una cuenta o reiniciar tu membresía.
                </p>

                <div class="email-form">
                    <input type="email" placeholder="Email">
                    <button class="start-btn">
                        Comenzar >
                    </button>
                </div>

            </div>

        </div>

    </section>

    <section class="cards">

        <h2>Tendencias</h2>

            <div class="slider-container">

        <button class="slider-btn prev-btn" onclick="slideLeft()">
            &#10094;
        </button>

        <div class="movie-row" id="movieSlider">

            <div class="movie-card">
                <img src="images/card1.png">
                <span class="rank">1</span>
            </div>

            <div class="movie-card">
                <img src="images/card2.png">
                <span class="rank">2</span>
            </div>

            <div class="movie-card">
                <img src="images/card3.png">
                <span class="rank">3</span>
            </div>

            <div class="movie-card">
                <img src="images/card4.png">
                <span class="rank">4</span>
            </div>

            <div class="movie-card">
                <img src="images/card5.png">
                <span class="rank">5</span>
            </div>

            <div class="movie-card">
                <img src="images/card6.png">
                <span class="rank">6</span>
            </div>

            <div class="movie-card">
                <img src="images/card7.png">
                <span class="rank">7</span>
            </div>

            <div class="movie-card">
                <img src="images/card8.png">
                <span class="rank">8</span>
            </div>

            <div class="movie-card">
                <img src="images/card9.png">
                <span class="rank">9</span>
            </div>

            <div class="movie-card">
                <img src="images/card10.png">
                <span class="rank">10</span>
            </div>

        </div>

        <button class="slider-btn next-btn" onclick="slideRight()">
            &#10095;
        </button>

    </div>

</section>

    </section>

    <footer class="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
function slideLeft() {
    document.getElementById('movieSlider').scrollBy({
        left: -900,
        behavior: 'smooth'
    });
}

function slideRight() {
    document.getElementById('movieSlider').scrollBy({
        left: 900,
        behavior: 'smooth'
    });
}
</script>

</body>

</html>
